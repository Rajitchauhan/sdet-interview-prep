<path class="internal" d="M160,155 L250,340 L300,520 L260,640"/><path class="internal" d="M250,340 L430,360 L520,470 L520,710"/><path class="internal" d="M430,110 L430,360 L600,420 L680,690"/><path class="internal" d="M620,115 L600,420 L790,430 L850,600"/><path class="internal" d="M900,185 L790,430 L960,490"/>
