<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#e8f3f7"/>
<style>text{font-family:Arial,sans-serif;fill:#243746}.title{font-size:30px;font-weight:bold}.subtitle{font-size:17px}.state{font-size:30px;font-weight:bold;fill:#334155}.small{font-size:15px}.label{font-size:19px;font-weight:bold}.border{fill:#f3e9d4;stroke:#4c6470;stroke-width:4}.internal{fill:none;stroke:#71838b;stroke-width:3;stroke-dasharray:10 8}.river{fill:none;stroke:#2585b8;stroke-width:8;stroke-linecap:round}.mountain{fill:#9b8872;stroke:#655746;stroke-width:2}.forest{fill:#789b78;stroke:#416847;stroke-width:2}.dot{fill:#fff;stroke:#293b45;stroke-width:3}</style>
<text x="700" y="50" text-anchor="middle" class="title">EDITABLE GEOGRAPHY SAMPLE — NOT CANON</text><text x="700" y="80" text-anchor="middle" class="subtitle">Placeholder landforms, borders, resources and labels. Move, redraw or delete freely.</text>
<!-- Main continent outline -->
<path class="border" d="M100,210 L160,155 L260,130 L340,160 L430,110 L540,145 L620,115 L720,155 L820,130 L900,185 L950,240 L930,330 L990,390 L960,490 L920,550 L850,600 L790,670 L680,690 L600,660 L520,710 L420,670 L340,700 L260,640 L200,590 L150,500 L110,420 L80,330 Z"/>
